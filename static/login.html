<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — David Trading</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#131722"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="David">
</head>
<body class="login-page">
<form class="dlg login-card" id="login-form">
  <a href="/" class="brand"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2962ff"/><path d="M6 22l6-7 5 4 9-11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>David<b>Trading</b></span></a>
  <div class="mode-toggle auth-tabs" role="tablist">
    <button type="button" role="tab" data-mode="login" class="active">Log in</button>
    <button type="button" role="tab" data-mode="register">Create account</button>
  </div>
  <p class="muted" id="intro">Log in to get your demo money and David Autopilot on any device.</p>
  <label class="field">Email<input id="email" type="email" autocomplete="email" required autofocus></label>
  <label class="field" id="pw-wrap">Password<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
  <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>
  <label class="field" id="pw2-wrap" hidden>Repeat password<input id="pw2" type="password" autocomplete="new-password" minlength="8"></label>
  <p class="order-err" id="err" role="alert"></p>
  <p class="ok-msg" id="ok" role="status"></p>
  <div class="dlg-actions"><a href="/" class="btn-ghost">Back</a><button class="btn-primary" type="submit" id="submit">Log in</button></div>
  <p class="muted small-note">Play money only. Your account just remembers your demo portfolio and David's fund.</p>
</form>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search), next = params.get("next");
const target = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
let mode = "login";
const INTRO = {
  login: "Log in to get your demo money and David Autopilot on any device.",
  register: "Make a free account with your email. Your demo money and David's fund are saved to it.",
  forgot: "Forgot your password? Enter your account's email and we'll send you a link to set a new one.",
};
function setMode(m) {
  mode = m; $("err").textContent = ""; $("ok").textContent = "";
  document.querySelectorAll(".auth-tabs button").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
  const reg = m === "register", forgot = m === "forgot";
  $("pw2-wrap").hidden = !reg; $("pw2").required = reg;
  $("pw-wrap").hidden = forgot; $("pw").required = !forgot;
  $("forgot-btn").hidden = m !== "login";
  $("pw").autocomplete = reg ? "new-password" : "current-password";
  $("submit").textContent = reg ? "Create account" : forgot ? "Send reset link" : "Log in";
  $("intro").textContent = INTRO[m];
  if (forgot) $("email").focus();
}
$("forgot-btn").addEventListener("click", () => setMode("forgot"));
document.querySelectorAll(".auth-tabs button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
if (params.get("mode") === "register" || params.get("mode") === "forgot") setMode(params.get("mode"));
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = ""; $("ok").textContent = "";
  if (mode === "forgot") {
    $("submit").disabled = true;
    try {
      const r = await fetch("/api/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Something went wrong");
      $("ok").textContent = "If an account exists for " + $("email").value.trim() + ", we've sent it a reset link. Check your inbox and spam folder. The link works for 60 minutes.";
    } catch (x) { $("err").textContent = x.message; }
    finally { $("submit").disabled = false; }
    return;
  }
  if (mode === "register" && $("pw").value !== $("pw2").value) { $("err").textContent = "The two passwords don't match."; return; }
  $("submit").disabled = true;
  try {
    const r = await fetch(mode === "register" ? "/api/register" : "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("pw").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Something went wrong");
    location.href = target;
  } catch (x) { $("err").textContent = x.message; }
  finally { $("submit").disabled = false; }
});
</script>
<script src="/pwa.js"></script>
</body>
</html>
